# NATIVE graphics renders through real Skia, which is what makes Roborazzi screenshots
# match a device instead of coming out blank.
graphicsMode=NATIVE
# Pinned below compileSdk (37): Robolectric only ships android-all jars for released
# platforms, and tracking the newest compileSdk would break the build on every SDK bump.
sdk=35
# Robolectric's default screen is 320x470dp. The gallery is meant to render at phone width,
# and a specimen taller than 470dp was silently clipped at the bottom. Tall enough that no
# specimen clips; the capture is the content's own height, not the screen's. mdpi keeps the
# golden files small.
qualifiers=w392dp-h1600dp-mdpi
