# Project-wide Gradle settings.

# --- Daemon -------------------------------------------------------------
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# --- Kotlin -------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true

# --- Android ------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP (2.2.10-2.0.2) still registers its generated source directories through the
# `kotlin.sourceSets` DSL, which AGP 9's built-in Kotlin support rejects by default.
# AGP documents this flag as the supported escape hatch until KSP migrates to
# `android.sourceSets`. Revisit when KSP ships an AGP-9-aware release.
# https://developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false
