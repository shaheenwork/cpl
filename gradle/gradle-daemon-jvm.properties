# The Gradle daemon runs on JDK 21 (LTS), not the JDK 25 that Android Studio bundles.
# See DECISIONS.md D-005: detekt 1.23.8 embeds the Kotlin 2.0.21 compiler, whose bundled
# IntelliJ JavaVersion parser throws on the string "25.0.2". It reads the running JVM, so
# no task configuration can work around it. JDK 21 is supported by Gradle 9.5, AGP 9.3.3,
# Kotlin 2.2.10 and detekt alike. Compiled bytecode targets Java 17 regardless.
toolchainVersion=21
